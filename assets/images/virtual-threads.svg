="835" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="861" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-13</text><rect x="895" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="921" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-14</text><rect x="955" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="981" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-15</text><rect x="1015" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="1041" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">…</text><text x="590" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#16a34a" text-anchor="middle">VT-1 000 000 … VT-M</text><path d="M200 220 C 200 260, 260 250, 260 285" stroke="#22c55e" stroke-width="2.4" fill="none" marker-end="url(#arr2)"/><path d="M420 220 C 420 260, 420 250, 420 285" stroke="#22c55e" stroke-width="2.4" fill="none" marker-end="url(#arr2)"/><path d="M640 220 C 640 260, 580 250, 580 285" stroke="#22c55e" stroke-width="2.4" fill="none" marker-end="url(#arr2)"/><path d="M860 220 C 860 260, 740 250, 740 285" stroke="#22c55e" stroke-width="2.4" fill="none" marker-end="url(#arr2)"/><path d="M1000 220 C 1000 260, 900 250, 900 285" stroke="#22c55e" stroke-width="2.4" fill="none" marker-end="url(#arr2)"/><text x="330" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">монтируются (mount)</text><rect x="190" y="290" width="800" height="130" rx="12" fill="#fdefdd" stroke="#f89820" stroke-width="1.6"/><text x="590" y="318" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">Потоки-носители (carrier) — ForkJoinPool, обычно N = числу ядер</text><rect x="235" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="274" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P1</text><rect x="327" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="366" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P2</text><rect x="419" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="458" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P3</text><rect x="511" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="550" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P4</text><rect x="603" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="642" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P5</text><rect x="695" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="734" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P6</text><rect x="787" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="826" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P7</text><rect x="879" y="335" width="78" height="44" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="918" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">P8</text><path d="M300 420 V455" stroke="#f89820" stroke-width="2.4" marker-end="url(#arr3)"/><path d="M590 420 V455" stroke="#f89820" stroke-width="2.4" marker-end="url(#arr3)"/><path d="M880 420 V455" stroke="#f89820" stroke-width="2.4" marker-end="url(#arr3)"/><rect x="190" y="460" width="800" height="80" rx="12" fill="#eef3f7" stroke="#5382a1" stroke-width="1.6"/><text x="590" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2c4a60" text-anchor="middle">Потоки операционной системы (дорогие: ~1 МБ стека, контекст-свитч через ядро)</text><text x="590" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">CPU: ядро 1 · ядро 2 · ядро 3 · ядро 4 …</text><rect x="90" y="560" width="1000" height="56" rx="10" fill="#fffbeb" stroke="#f89820" stroke-width="1.6"/><text x="590" y="584" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">При блокировке (sleep, сеть, БД) виртуальный поток ОТСОЕДИНЯЕТСЯ —</text><text x="590" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">носитель немедленно берёт следующий VT. Простаивания почти нет.</text></svg>