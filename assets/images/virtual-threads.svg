<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640"><rect width="1180" height="640" fill="#ffffff"/><text x="590" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">Виртуальные потоки JDK 21: M задач на N потоков-носителей</text><defs><marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#22c55e"/></marker><marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f89820"/></marker></defs><rect x="90" y="70" width="1000" height="150" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/><text x="590" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#15803d" text-anchor="middle">Виртуальные потоки (их могут быть МИЛЛИОНЫ; стек — в куче, ~КБ)</text><rect x="115" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="141" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-1</text><rect x="175" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="201" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-2</text><rect x="235" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="261" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-3</text><rect x="295" y="115" width="52" height="40" rx="7" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/><text x="321" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">VT-4</text><rect x="355" y="115" width="52" height="4