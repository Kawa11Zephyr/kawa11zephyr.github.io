<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720"><rect width="1180" height="720" fill="#ffffff"/><text x="590" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Архитектура JVM (Java Virtual Machine)</text><rect x="30" y="300" width="130" height="90" rx="10" fill="#fdefdd" stroke="#f89820" stroke-width="1.6"/><text x="95" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">Hello.class</text><text x="95" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#b45309" text-anchor="middle">(байткод)</text><path d="M160 345 H215" stroke="#5382a1" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5382a1"/></marker></defs><rect x="220" y="80" width="730" height="560" rx="16" fill="#fbfcfe" stroke="#5382a1" stroke-width="1.6"/><text x="585" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#2c4a60" text-anchor="middle">JVM</text><rect x="245" y="135" width="200" height="480" rx="10" fill="#eef3f7" stroke="#5382a1" stroke-width="1.6"/><text x="345" y="163" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c4a60" text-anchor="middle">Загрузчик классов</text><text x="345" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">(Class Loader Subsystem)</text><rect x="262" y="205" width="166" height="108" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="345" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">Загрузка</text><text x="345" y="261" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Loading:</text><text x="345" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">чтение .class в память</text><rect x="262" y="335" width="166" height="108" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="345" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">Компоновка</text><text x="345" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Linking:</text><text x="345" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">верификация, подготовка,</text><text x="345" y="426" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">разрешение</text><rect x="262" y="465" width="166" height="108" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="345" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">Инициализация</text><text x="345" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">static-поля, конструкторы</text><path d="M445 375 H480" stroke="#5382a1" stroke-width="3" marker-end="url(#arr)"/><rect x="480" y="135" width="230" height="480" rx="10" fill="#eef3f7" stroke="#5382a1" stroke-width="1.6"/><text x="595" y="163" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c4a60" text-anchor="middle">Области данных</text><text x="595" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">(Runtime Data Areas)</text><rect x="497" y="200" width="196" height="68" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="595" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Method Area</text><text x="595" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">классы, константы, static</text><rect x="497" y="282" width="196" height="68" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="595" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Heap (куча)</text><text x="595" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">объекты — общая для всех</text><rect x="497" y="364" width="196" height="68" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="595" y="392" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">JVM Stacks</text><text x="595" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">кадры методов, локальные</text><rect x="497" y="446" width="196" height="68" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="595" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">PC Registers</text><text x="595" y="496" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">адрес текущей инструкции</text><rect x="497" y="528" width="196" height="68" rx="8" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="595" y="556" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Native Stacks</text><text x="595" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">стеки нативных методов</text><path d="M710 375 H745" stroke="#5382a1" stroke-width="3" marker-end="url(#arr)"/><rect x="745" y="135" width="180" height="480" rx="10" fill="#fdefdd" stroke="#f89820" stroke-width="1.6"/><text x="835" y="163" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">Движок выполнения</text><text x="835" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#d9a05b" text-anchor="middle">(Execution Engine)</text><rect x="760" y="210" width="150" height="96" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="835" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Интерпретатор</text><text x="835" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">построчно исполняет</text><text x="835" y="281" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">байткод</text><rect x="760" y="328" width="150" height="96" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="835" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">JIT-компилятор</text><text x="835" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">«горячий» код → машинный</text><rect x="760" y="446" width="150" height="96" rx="8" fill="#ffffff" stroke="#f89820" stroke-width="1.6"/><text x="835" y="476" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Garbage Collector</text><text x="835" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">автоматическая очистка</text><text x="835" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">кучи</text><path d="M925 300 H975" stroke="#5382a1" stroke-width="3" marker-end="url(#arr)"/><rect x="975" y="220" width="175" height="160" rx="10" fill="#eef3f7" stroke="#5382a1" stroke-width="1.6"/><text x="1062" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2c4a60" text-anchor="middle">Native Method</text><text x="1062" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2c4a60" text-anchor="middle">Interface (JNI)</text><text x="1062" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">мост к библиотекам</text><text x="1062" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">C / C++ / ОС</text><rect x="975" y="420" width="175" height="110" rx="10" fill="#ffffff" stroke="#5382a1" stroke-width="1.6"/><text x="1062" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Native Libraries</text><text x="1062" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">libc, OpenGL, SSL…</text><path d="M1062 380 V420" stroke="#5382a1" stroke-width="3" marker-end="url(#arr)"/><text x="585" y="682" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Байткод исполняется одинаково на любой платформе — «Write Once, Run Anywhere»</text></svg>